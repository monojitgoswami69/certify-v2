name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check migration history and schema drift
        run: |
          npm run db:check
          npm run db:generate
          git diff --exit-code -- drizzle

      - name: Lint (typegen + tsc)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          # next/font fetches font files at build time.
          NEXT_TELEMETRY_DISABLED: 1
